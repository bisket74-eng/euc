<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EUC Range & Charge Calculator</title>
    <style>
        :root {
            --bg-color: #0f1115;
            --panel-bg: #1a1d24;
            --primary-accent: #00e5ff;
            --secondary-accent: #ff2a6d;
            --text-main: #f0f4f8;
            --text-muted: #8b95a5;
            --border-radius: 10px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 5px;
            overflow: hidden;
        }

        .container {
            background-color: var(--panel-bg);
            max-width: 820px;
            width: 100%;
            border-radius: var(--border-radius);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.05);
            overflow: hidden;
            display: grid;
            grid-template-columns: 1fr;
        }

        @media(min-width: 768px) {
            .container {
                grid-template-columns: 1fr 1fr;
            }
        }

        .header {
            grid-column: 1 / -1;
            padding: 10px 15px;
            background: linear-gradient(90deg, #13151a 0%, #1a1d24 100%);
            border-bottom: 2px solid var(--primary-accent);
            text-align: center;
        }

        .header h1 {
            font-size: 1.2rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        .input-section {
            padding: 12px;
            border-right: 1px solid rgba(255,255,255,0.05);
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .output-section {
            padding: 12px;
            background-color: rgba(0, 229, 255, 0.02);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .form-group {
            margin-bottom: 4px;
        }

        label {
            display: block;
            margin-bottom: 2px;
            font-weight: 600;
            color: var(--text-muted);
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        select, input[type="range"] {
            width: 100%;
            background-color: #0f1115;
            color: var(--text-main);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 5px 8px;
            border-radius: 6px;
            font-size: 0.85rem;
            outline: none;
            transition: border-color 0.3s;
        }

        select:focus {
            border-color: var(--primary-accent);
        }

        .slider-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .slider-value {
            color: var(--primary-accent);
            font-weight: bold;
            font-size: 0.85rem;
        }

        input[type=range] {
            -webkit-appearance: none;
            padding: 0;
            height: 4px;
            background: #2a2e39;
            border-radius: 2px;
            margin-top: 3px;
            border: none;
        }
        
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 12px;
            width: 12px;
            border-radius: 50%;
            background: var(--primary-accent);
            cursor: pointer;
            box-shadow: 0 0 6px rgba(0, 229, 255, 0.5);
        }

        .charge-inputs {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 6px;
            background: rgba(0,0,0,0.2);
            padding: 6px;
            border-radius: 6px;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .specs-card {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 6px;
            padding: 6px 10px;
            margin-bottom: 8px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
        }

        .spec-item {
            display: flex;
            flex-direction: column;
        }

        .spec-label {
            font-size: 0.6rem;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .spec-value {
            font-size: 0.9rem;
            font-weight: bold;
            color: #fff;
        }

        .results-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
            margin-bottom: 8px;
        }

        .result-card {
            background: linear-gradient(135deg, rgba(0,229,255,0.1) 0%, rgba(255,42,109,0.1) 100%);
            border: 1px solid rgba(0,229,255,0.3);
            border-radius: 8px;
            padding: 8px;
            text-align: center;
        }

        .result-title {
            color: var(--primary-accent);
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 2px;
        }

        .result-range {
            font-size: 1.4rem;
            font-weight: 800;
            color: #fff;
            text-shadow: 0 0 8px rgba(0,229,255,0.4);
            margin-bottom: 1px;
        }

        .result-sub {
            color: var(--text-muted);
            font-size: 0.65rem;
        }

        .breakdown {
            font-size: 0.7rem;
            color: var(--text-muted);
            background: #0f1115;
            padding: 6px 8px;
            border-radius: 6px;
        }
        
        .breakdown-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 2px;
        }
        
        .breakdown-row:last-child {
            margin-bottom: 0;
            padding-top: 2px;
            border-top: 1px solid rgba(255,255,255,0.1);
            color: #fff;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>EUC Range & Charge Calculator</h1>
        </div>

        <div class="input-section">
            <div class="form-group">
                <label for="brand">Brand</label>
                <select id="brand"></select>
            </div>
            
            <div class="form-group">
                <label for="model">Model</label>
                <select id="model"></select>
            </div>

            <div class="form-group">
                <div class="slider-header">
                    <label for="weight">Rider Weight (lbs)</label>
                    <span class="slider-value" id="weightVal">140</span>
                </div>
                <input type="range" id="weight" min="100" max="350" value="140">
            </div>

            <div class="form-group">
                <div class="slider-header">
                    <label for="speed">Avg Cruising Speed (mph)</label>
                    <span class="slider-value" id="speedVal">33</span>
                </div>
                <input type="range" id="speed" min="10" max="55" value="33">
            </div>

            <div class="form-group">
                <div class="slider-header">
                    <label for="temp">Ambient Temp (°F)</label>
                    <span class="slider-value" id="tempVal">70</span>
                </div>
                <input type="range" id="temp" min="10" max="110" value="70">
            </div>

            <!-- Charge Speed Controls -->
            <label>Charge Estimator Settings</label>
            <div class="charge-inputs">
                <div class="form-group">
                    <label for="startPct">Start %</label>
                    <input type="number" id="startPct" min="0" max="99" value="20">
                </div>
                <div class="form-group">
                    <label for="targetPct">Target %</label>
                    <input type="number" id="targetPct" min="1" max="100" value="90">
                </div>
                <div class="form-group">
                    <label for="chargeAmps">Amps (A)</label>
                    <input type="number" id="chargeAmps" min="1" max="20" value="5">
                </div>
            </div>
        </div>

        <div class="output-section">
            <div>
                <label>Hardware Specs</label>
                <div class="specs-card">
                    <div class="spec-item">
                        <span class="spec-label">Battery</span>
                        <span class="spec-value" id="spec-battery">3600 Wh</span>
                    </div>
                    <div class="spec-item">
                        <span class="spec-label">Voltage</span>
                        <span class="spec-value" id="spec-voltage">134.4 V</span>
                    </div>
                    <div class="spec-item">
                        <span class="spec-label">Motor</span>
                        <span class="spec-value" id="spec-motor">4000 W</span>
                    </div>
                    <div class="spec-item">
                        <span class="spec-label">Suspension</span>
                        <span class="spec-value" id="spec-suspension">Yes</span>
                    </div>
                </div>

                <div class="results-grid">
                    <div class="result-card">
                        <div class="result-title">Charge Window</div>
                        <div class="result-range" id="result-window">65 - 75 mi</div>
                        <div class="result-sub">20% safety margin</div>
                    </div>

                    <div class="result-card">
                        <div class="result-title">Charge Time</div>
                        <div class="result-range" id="result-chargetime">4.3 hrs</div>
                        <div class="result-sub" id="result-chargerpower">672 Watts</div>
                    </div>
                </div>
            </div>

            <div class="breakdown">
                <div class="breakdown-row">
                    <span>Est. Consumption</span>
                    <span id="calc-consumption">42.5 Wh/mi</span>
                </div>
                <div class="breakdown-row">
                    <span>Usable Battery Capacity</span>
                    <span id="calc-usable">2880 Wh</span>
                </div>
                <div class="breakdown-row">
                    <span>Theoretical Max Range</span>
                    <span id="calc-max">85 mi</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        const eucDatabase = {
            "Begode": [
                { id: "panther", name: "Panther", battery: 4400, voltage: 168.0, motor: 5000, tire: 22, suspension: true },
                { id: "ex30", name: "EX30", battery: 3600, voltage: 134.4, motor: 4000, tire: 20, suspension: true },
                { id: "master_pro_v2", name: "Master Pro V2", battery: 4800, voltage: 134.4, motor: 4500, tire: 22, suspension: true },
                { id: "et_max", name: "ET Max", battery: 3000, voltage: 168.0, motor: 4500, tire: 20, suspension: true },
                { id: "blitz", name: "Blitz", battery: 2400, voltage: 134.4, motor: 3200, tire: 20, suspension: true },
                { id: "t4_pro", name: "T4 Pro", battery: 1800, voltage: 100.8, motor: 2500, tire: 16, suspension: true },
                { id: "falcon", name: "Falcon", battery: 900, voltage: 84.0, motor: 1000, tire: 14, suspension: true }
            ],
            "LeaperKim": [
                { id: "oryx", name: "Oryx", battery: 4200, voltage: 168.0, motor: 4200, tire: 14, suspension: true },
                { id: "sherman_l", name: "Sherman-L", battery: 4000, voltage: 151.2, motor: 3200, tire: 20, suspension: true },
                { id: "sherman_s", name: "Sherman-S", battery: 3600, voltage: 100.8, motor: 3000, tire: 20, suspension: true },
                { id: "lynx", name: "Lynx", battery: 2700, voltage: 151.2, motor: 3200, tire: 20, suspension: true },
                { id: "patton_s", name: "Patton-S", battery: 2220, voltage: 126.0, motor: 3000, tire: 16, suspension: true }
            ],
            "Inmotion": [
                { id: "p6", name: "P6", battery: 4200, voltage: 235.2, motor: 6000, tire: 14, suspension: true },
                { id: "v13", name: "V13 Challenger", battery: 3024, voltage: 126.0, motor: 4500, tire: 22, suspension: true },
                { id: "v14", name: "V14 Adventure", battery: 2400, voltage: 134.4, motor: 4000, tire: 16, suspension: true },
                { id: "v11y", name: "V11Y", battery: 1500, voltage: 84.0, motor: 2500, tire: 18, suspension: true },
                { id: "v12_ht", name: "V12 High Torque", battery: 1750, voltage: 100.8, motor: 2800, tire: 16, suspension: false }
            ],
            "King Song": [
                { id: "f18", name: "F18", battery: 2664, voltage: 126.0, motor: 5000, tire: 20, suspension: true },
                { id: "s22_pro", name: "S22 Pro", battery: 2220, voltage: 126.0, motor: 3300, tire: 20, suspension: true },
                { id: "s16_pro", name: "S16 Pro", battery: 1480, voltage: 84.0, motor: 3000, tire: 16, suspension: true },
                { id: "16x", name: "16X", battery: 1554, voltage: 84.0, motor: 2200, tire: 16, suspension: false }
            ]
        };

        const dom = {
            brand: document.getElementById('brand'),
            model: document.getElementById('model'),
            weight: document.getElementById('weight'),
            weightVal: document.getElementById('weightVal'),
            speed: document.getElementById('speed'),
            speedVal: document.getElementById('speedVal'),
            temp: document.getElementById('temp'),
            tempVal: document.getElementById('tempVal'),
            startPct: document.getElementById('startPct'),
            targetPct: document.getElementById('targetPct'),
            chargeAmps: document.getElementById('chargeAmps'),
            specBattery: document.getElementById('spec-battery'),
            specVoltage: document.getElementById('spec-voltage'),
            specMotor: document.getElementById('spec-motor'),
            specSuspension: document.getElementById('spec-suspension'),
            resultWindow: document.getElementById('result-window'),
            resultChargeTime: document.getElementById('result-chargetime'),
            resultChargerPower: document.getElementById('result-chargerpower'),
            calcConsumption: document.getElementById('calc-consumption'),
            calcUsable: document.getElementById('calc-usable'),
            calcMax: document.getElementById('calc-max')
        };

        function initSelects() {
            Object.keys(eucDatabase).forEach(brand => {
                const opt = document.createElement('option');
                opt.value = brand;
                opt.textContent = brand;
                dom.brand.appendChild(opt);
            });
            
            dom.brand.value = "Begode";
            updateModels();
            dom.model.value = "ex30";
        }

        function updateModels() {
            dom.model.innerHTML = '';
            const selectedBrand = dom.brand.value;
            eucDatabase[selectedBrand].forEach(model => {
                const opt = document.createElement('option');
                opt.value = model.id;
                opt.textContent = model.name;
                dom.model.appendChild(opt);
            });
            calculateAll();
        }

        function getCurrentModel() {
            const brand = dom.brand.value;
            const modelId = dom.model.value;
            return eucDatabase[brand].find(m => m.id === modelId);
        }

        function calculateAll() {
            const model = getCurrentModel();
            if (!model) return;

            const weight = parseInt(dom.weight.value);
            const speed = parseInt(dom.speed.value);
            const temp = parseInt(dom.temp.value);

            // Hardware UI
            dom.specBattery.textContent = `${model.battery} Wh`;
            dom.specVoltage.textContent = `${model.voltage} V`;
            dom.specMotor.textContent = `${model.motor} W`;
            dom.specSuspension.textContent = model.suspension ? "Yes" : "No";

            // 1. RANGE CALCULATIONS
            const rollingResistance = 12 + (weight * 0.012);
            const aeroDrag = 0.038 * Math.pow(speed, 2) * (weight / 160);
            const suspensionPenalty = model.suspension ? 1.5 : 0;
            let whPerMile = rollingResistance + aeroDrag + suspensionPenalty;

            let tempCapacityFactor = temp < 60 ? Math.max(0.55, 1.0 - ((60 - temp) * 0.008)) : 1.0;
            const actualCapacity = model.battery * tempCapacityFactor;
            const usableCapacity = actualCapacity * 0.80; 

            const safeRange = usableCapacity / whPerMile;
            const maxRange = actualCapacity / whPerMile;

            dom.calcConsumption.textContent = `${whPerMile.toFixed(1)} Wh/mi`;
            dom.calcUsable.textContent = `${Math.round(usableCapacity)} Wh`;
            dom.calcMax.textContent = `${Math.round(maxRange)} mi`;

            const minWindow = Math.max(0, Math.round(safeRange - 5));
            const maxWindow = Math.round(safeRange + 5);
            dom.resultWindow.textContent = `${minWindow} - ${maxWindow} mi`;

            // 2. CHARGING TIME CALCULATIONS
            const startPct = Math.min(99, Math.max(0, parseInt(dom.startPct.value) || 0));
            const targetPct = Math.min(100, Math.max(startPct + 1, parseInt(dom.targetPct.value) || 100));
            const amps = Math.max(1, parseFloat(dom.chargeAmps.value) || 1);

            const pctToGain = (targetPct - startPct) / 100;
            const whToCharge = model.battery * pctToGain;
            const chargePowerWatts = model.voltage * amps;

            // Efficiency multiplier (1.15 accounts for BMS balancing overhead)
            let hours = (whToCharge / chargePowerWatts) * 1.15;

            if (hours < 1) {
                const mins = Math.round(hours * 60);
                dom.resultChargeTime.textContent = `${mins} mins`;
            } else {
                dom.resultChargeTime.textContent = `${hours.toFixed(1)} hrs`;
            }
            dom.resultChargerPower.textContent = `${Math.round(chargePowerWatts)}W Charging`;
        }

        dom.brand.addEventListener('change', updateModels);
        dom.model.addEventListener('change', calculateAll);

        ['weight', 'speed', 'temp', 'startPct', 'targetPct', 'chargeAmps'].forEach(id => {
            dom[id].addEventListener('input', calculateAll);
            if (dom[`${id}Val`]) {
                dom[id].addEventListener('input', (e) => dom[`${id}Val`].textContent = e.target.value);
            }
        });

        initSelects();
        calculateAll();
    </script>
</body>
</html>
